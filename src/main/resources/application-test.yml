spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  flyway:
    enabled: true
    locations: filesystem:src/test/resources/db/test-migration
  h2:
    console:
      enabled: false

app:
  retrieval:
    max-chunks: 5
    chunk-size: 800
    chunk-overlap: 100
  ai:
    timeout-seconds: 5
    max-question-length: 500

logging:
  level:
    com.enterprise.knowledge: DEBUG
    org.springframework.security: WARN
