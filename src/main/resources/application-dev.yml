spring:
  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_kb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    com.enterprise.knowledge: DEBUG
    org.springframework.security: INFO
    org.springframework.ai: INFO
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
