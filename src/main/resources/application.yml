spring:
  profiles:
    active: dev
  application:
    name: enterprise-knowledge-assistant
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    open-in-view: false

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_MODEL:qwen2.5:3b}
        options:
          temperature: 0.1
          num-predict: 1024
      embedding:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  retrieval:
    max-chunks: 5
    chunk-size: 800
    chunk-overlap: 100
  ai:
    timeout-seconds: 30
    max-question-length: 500
