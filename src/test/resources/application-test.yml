spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=YEAR,VALUE,INTERVAL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/test-migration

app:
  retrieval:
    max-chunks: 5
    chunk-size: 800
    chunk-overlap: 100
  ai:
    timeout-seconds: 5
    max-question-length: 500

logging:
  level:
    com.enterprise.knowledge: WARN
    org.springframework.security: WARN
    org.flywaydb: WARN
